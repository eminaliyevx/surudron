[package]
name = "surudron"
version = "1.0.0"
description = "SuruDron"
authors = ["TIAM"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.96.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.32"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2.8.0"
serialport = "4.9.0"
thiserror = "2.0.18"
