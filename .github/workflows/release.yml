name: Build SuruDron (Windows)
on: [push]

env:
  # Opt into Node 24 early to fix deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # Updated version
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: bun install

      - name: Build Rust Binary
        run: cargo build --release
        working-directory: apps/serial

      - name: Build Web Frontend
        run: bun run build
        working-directory: apps/web

      - name: Build Desktop App
        run: bun run --filter @surudron/desktop build --channel stable

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surudron-windows-dist
          # Recursive glob ensures we find the .zip or .exe regardless of subfolders
          path: apps/desktop/artifacts/**
          if-no-files-found: error
