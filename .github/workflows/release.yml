name: Release Surudron Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/serial -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bun run build:desktop

      - name: Package Application
        # This uses PowerShell (the default on Windows runners) to rename the launcher and zip the folder
        run: |
          cd apps/desktop/build/stable-win-x64/

          # Rename the extensionless launcher to a clickable .exe
          Rename-Item -Path "SuruDron\bin\launcher" -NewName "SuruDron.exe"

          # Compress the entire SuruDron folder into a single Zip file
          Compress-Archive -Path "SuruDron" -DestinationPath "SuruDron-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: surudron-windows
          path: apps/desktop/build/stable-win-x64/SuruDron-Windows.zip
