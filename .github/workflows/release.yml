name: Release Surudron Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/serial -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bun run build:desktop

      # NEW: Install Inno Setup using Chocolatey (pre-installed on Windows runners)
      - name: Install Inno Setup
        run: choco install innosetup -y

      # NEW: Compile the setup wizard
      - name: Build Windows Installer
        run: iscc apps/desktop/installer.iss

      # UPDATED: Upload the final setup.exe instead of the raw build folder
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surudron-windows-installer
          path: apps/desktop/Output/SuruDron-Windows-Setup.exe
