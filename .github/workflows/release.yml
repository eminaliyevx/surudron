name: Build SuruDron (Windows)
on: [push]

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: bun install

      - name: Build Rust Binary
        # Compiles the serial manager to apps/serial/target/release/serial.exe
        run: cargo build --release
        working-directory: apps/serial

      - name: Build Web Frontend
        # Generates the production dist in apps/web/dist
        run: bun run build
        working-directory: apps/web

      - name: Build Desktop App
        # Packages everything using the Electrobun production channel
        run: bun run --filter @surudron/desktop build --channel stable

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surudron-windows-dist
          # Electrobun places Windows artifacts in the artifacts folder
          path: apps/desktop/artifacts/
