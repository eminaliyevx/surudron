name: Build SuruDron (Windows)
on: [push]

env:
  # This kills the Node 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/serial/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Dependencies
        run: bun install

      - name: Build Rust Binary
        run: cargo build --release
        working-directory: apps/serial

      - name: Build Web Frontend
        run: bun run build
        working-directory: apps/web

      - name: Build Desktop App
        run: bun run --filter @surudron/desktop build --channel stable

      # DEBUG STEP: This helps us find where the files actually are if the upload fails
      - name: List Artifacts Directory
        run: Get-ChildItem -Path apps/desktop/artifacts -Recurse
        shell: powershell

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surudron-windows-dist
          # We use a broader wildcard and allow multiple subdirectories
          path: |
            apps/desktop/artifacts/**/*.zip
            apps/desktop/artifacts/**/*.exe
            apps/desktop/artifacts/**/*.json
          if-no-files-found: error
