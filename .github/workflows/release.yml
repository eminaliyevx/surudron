name: Release Surudron Desktop

on:
  push:
    tags:
      - "v*" # Triggers on version tags e.g., v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux requires specific WebKit and GTK packages to compile desktop webviews
      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/serial -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinning to the version specified in your package.json
          bun-version: "1.3.13"

      - name: Install Dependencies
        run: bun install

      # The root package.json explicitly orchestrates the serial, web, and desktop builds
      - name: Build Application
        run: bun run build:desktop

      # (Optional) If you use tools like InnoSetup to generate a Windows installer, execute that script here.
      - name: Build Windows Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Run your installer packaging script here (e.g., iscc installer.iss)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surudron-${{ matrix.os }}
          # Electrobun usually outputs to a build/ directory. Adjust if your config pushes artifacts elsewhere.
          path: apps/desktop/build/
