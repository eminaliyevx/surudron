name: Build Windows Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags e.g., v1.0.0
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli@2 -y

      - name: Build Tauri App
        run: cargo tauri build
        working-directory: ./apps/tauri

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            apps/tauri/target/release/bundle/nsis/*.exe
            apps/tauri/target/release/bundle/msi/*.msi
          name: "Surudron ${{ github.ref_name }}"
          body: "Download the Windows installer below."
          draft: true
          prerelease: false
